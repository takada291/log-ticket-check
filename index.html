<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出材伝票集計確認</title>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        :root {
            --primary: #2c3e50;
            --bg-color: #f8f9fa;
            --accent: #d35400; /* 伝票チェック用にオレンジ系のアクセント */
            --error-bg: #ffe6e6;
            --success-bg: #e6ffe6;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0; padding: 20px; line-height: 1.6;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background: white; padding: 20px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; }
        label {
            display: block; font-weight: bold; margin-bottom: 5px;
            color: var(--primary); font-size: 0.9rem;
        }
        input[type="password"], input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        .btn-run {
            width: 100%; padding: 15px; background-color: var(--accent);
            color: white; border: none; border-radius: 4px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }
        .btn-run:hover { background-color: #a04000; }
        .btn-run:disabled { background-color: #ccc; cursor: not-allowed; }
        .api-note {
            font-size: 0.8rem; color: #666; background: #eee;
            padding: 10px; border-radius: 4px; margin-bottom: 20px;
        }
        #loading-msg {
            text-align: center; font-weight: bold; color: var(--accent);
            display: none; margin-top: 20px;
        }
        #result-area { display: none; margin-top: 30px; }
        table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        .summary-box {
            background: var(--success-bg); padding: 15px; border-radius: 5px;
            margin-bottom: 20px; border: 1px solid #b3ffb3; text-align: center;
        }
        .summary-box h3 { margin: 0; color: #2c3e50; font-size: 1.5rem; }
        .summary-box p { margin: 5px 0 0 0; color: #555; }
        
        .editable-input {
            width: 100%; max-width: 120px; padding: 6px;
            border: 1px solid #ccc; border-radius: 4px;
            text-align: right; font-family: inherit;
            font-size: 0.95rem; background-color: #fff;
            box-sizing: border-box;
        }
        .editable-input[type="text"] { text-align: center; }
        .editable-input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 3px rgba(211, 84, 0, 0.5);
        }
        .editable-input.edited {
            background-color: #fff3cd; border-color: #ffeeba; color: #856404;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>出材伝票集計確認 v0.1</h1>
        
        <div class="api-note">
            <strong>APIキー設定（初回のみ）</strong><br>
            ブラウザに保存されるため、次回以降の入力は不要です。
        </div>
        <div class="input-group">
            <input type="password" id="api-key" placeholder="Google Gemini APIキーを入力">
        </div>

        <div class="input-group">
            <label>伝票（複数枚）の写真を一括選択してください</label>
            <input type="file" id="image-upload" accept="image/*" multiple>
            <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">※抽出したい数量（正味重量など）に赤いペンでアンダーラインを引いてから撮影してください。</p>
        </div>
        
        <button class="btn-run" id="btn-run">画像を読み込んで集計スタート</button>
        
        <div id="loading-msg">
            ⏳ AIが伝票番号と赤線の数値を読み取り中です...<br>
            <span style="font-size: 0.8rem; color:#666;" id="loading-detail">※複数枚ある場合は少し時間がかかります</span>
        </div>

        <div id="result-area">
            <div id="summary-area" class="summary-box"></div>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 5px; text-align: center;">※表内の数値は直接クリックして修正できます。修正すると即座に合計が再計算されます。</p>
            <h3>伝票読み取り明細</h3>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>伝票番号</th>
                        <th>数量 (kg等)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-upload');

        let currentData = null;
        let audioCtx = null; 

        // APIキーの復元（名前空間を変更）
        const savedKey = localStorage.getItem('gemini_api_key_ticket');
        if(savedKey) apiKeyInput.value = savedKey;

        // iOSのオーディオロック解除
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.01);
        }

        // ビープ音
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'success') {
                [0, 0.2, 0.4].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine'; osc.frequency.value = 880; 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.1);
                });
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth'; osc.frequency.value = 150; 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        async function findAvailableModel(apiKey) {
            try {
                loadingDetail.innerText = "最適なAIモデルを探しています...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`); 
                if (!response.ok) throw new Error("モデルリストの取得に失敗"); 
                const data = await response.json(); 
                const models = data.models || []; 
                const capableModels = models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent") && !m.name.includes("gemini-2.0") ); 
                let bestModel = capableModels.find(m => m.name.includes("gemini-1.5-pro")); 
                if (!bestModel) bestModel = capableModels.find(m => m.name.includes("gemini-1.5-flash")); 
                if (!bestModel && capableModels.length > 0) bestModel = capableModels[0]; 
                if (bestModel) return bestModel.name.replace("models/", ""); 
                return "gemini-1.5-flash"; 
            } catch (e) { 
                console.warn("モデル自動検出失敗:", e); 
                return "gemini-1.5-flash"; 
            } 
        } 
        
        async function fileToGenerativePart(file) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onloadend = () => { 
                    resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } }); 
                }; 
                reader.readAsDataURL(file); 
            }); 
        } 

        function renderTable(data) {
            const tbody = document.querySelector('#result-table tbody');
            tbody.innerHTML = '';
            
            data.tickets.forEach((ticket, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                
                const createInput = (field, val, type="number") => {
                    let step = type === "number" ? 'step="any"' : '';
                    let valueStr = val !== null && val !== undefined ? val : '';
                    return `<input type="${type}" ${step} class="editable-input" data-index="${index}" data-field="${field}" value="${valueStr}">`;
                };

                tr.innerHTML = `
                    <td>${createInput('id', ticket.id, 'text')}</td>
                    <td>${createInput('amount', ticket.amount, 'number')}</td>
                `;
                tbody.appendChild(tr);
            });

            document.querySelectorAll('.editable-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    const field = e.target.dataset.field;
                    const type = e.target.type;
                    
                    let val = null;
                    if(e.target.value !== '') {
                        val = type === 'number' ? parseFloat(e.target.value) : e.target.value;
                    }
                    
                    currentData.tickets[idx][field] = val;
                    e.target.classList.add('edited');
                    
                    recalculate(currentData);
                });
            });
            
            recalculate(data);
        }

        function recalculate(data) {
            let totalAmount = 0;
            let ticketCount = 0;

            data.tickets.forEach((ticket) => {
                let amt = parseFloat(ticket.amount);
                if (!isNaN(amt)) {
                    totalAmount += amt;
                    ticketCount++;
                }
            });

            const summaryArea = document.getElementById('summary-area');
            
            summaryArea.innerHTML = `
                <div style="font-size: 0.9rem; color: #666;">抽出伝票数: ${ticketCount}枚</div>
                <h3 style="font-size: 2.2rem; color: var(--accent); margin-bottom: 0;">${totalAmount.toLocaleString()} <span style="font-size: 1.2rem;">kg</span></h3>
            `;
        }

        btn.addEventListener('click', async () => { 
            unlockAudio();

            const apiKey = apiKeyInput.value.trim(); 
            const files = imageInput.files; 
            
            if(!apiKey) { alert('APIキーを入力してください'); return; } 
            if(files.length === 0) { alert('伝票の画像を選択してください'); return; } 
            
            localStorage.setItem('gemini_api_key_ticket', apiKey); 
            btn.disabled = true; loading.style.display = 'block'; resultArea.style.display = 'none'; 
            
            try { 
                const modelName = await findAvailableModel(apiKey); 
                loadingDetail.innerText = `伝票読取・集計中 (${modelName}を使用)...`;

                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: modelName });
                
                // ★プロンプト：赤線（Visual Prompting）に特化した指示
                const prompt = `
                    あなたは事務処理を自動化する厳格なアシスタントです。
                    添付された画像には、1枚または複数枚の「計量票（伝票）」が写っています。
                    画像の中から以下の2つの情報を抽出し、JSONフォーマットの配列で出力してください。

                    【抽出ルール】
                    1. id: 各伝票の上部などに記載されている「伝票番号（No.〇〇〇など）」を文字列として抽出してください（"No."などの記号も含めて構いません）。
                    2. amount: 各伝票の中で、「赤いペンでアンダーラインが引かれている数値」を確実に見つけ出し、カンマを除外した数値（Number）として抽出してください。
                    ※赤い線が引かれていない数値（総重量や空車重量など）は絶対に無視してください。

                    出力は以下のフォーマットのみとし、Markdownブロック（\`\`\`jsonなど）は不要です。
                    
                    {
                      "tickets": [
                        {"id": "No.113167", "amount": 8880},
                        {"id": "No.111350", "amount": 9020}
                      ]
                    }
                `;

                const imageParts = await Promise.all([...files].map(fileToGenerativePart));
                const result = await model.generateContent([prompt, ...imageParts]);
                let text = await result.response.text();
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                currentData = JSON.parse(text);
                
                renderTable(currentData);
                resultArea.style.display = 'block';
                
                playSound('success');

            } catch (error) {
                console.error(error);
                playSound('error');
                alert('エラーが発生しました。\n・APIキーが正しいか\n・画像の画質が低すぎないか\nを確認してください。\n詳細: ' + error.message);
            } finally {
                btn.disabled = false; loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
